# Included in the server block and again wherever a location sets its own add_header (nginx does
# not inherit add_header into a location that has one).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Scripts only from this origin; styles allow inline (Tailwind, React style attributes) and Google
# Fonts, which index.html loads; the API is same-origin through the proxy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
